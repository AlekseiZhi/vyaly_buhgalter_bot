services:
  postgres:
    image: postgres:16
    container_name: vyaly-buh-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buhgalter}
      POSTGRES_USER: ${POSTGRES_USER:-buhgalter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buhgalter} -d ${POSTGRES_DB:-buhgalter}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: