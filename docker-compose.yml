services:
  postgres:
    image: postgres:16

    container_name: vyaly-buh-postgres

    environment:
      POSTGRES_DB: buhgalter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_HOST_AUTH_METHOD: trust

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: